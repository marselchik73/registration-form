<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация · Валидация формы</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .form-card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
            padding: 2rem 2rem 2.5rem;
            width: 100%;
            max-width: 460px;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0 0 0.25rem 0;
            color: #1a2c3e;
            letter-spacing: -0.01em;
        }

        .sub {
            color: #5b6f82;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.75rem;
        }

        .input-group {
            margin-bottom: 1.6rem;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1e2f3f;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        /* ✨ ПОЛЯ БЕЗ ЗАКРУГЛЕНИЙ ✨ */
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 0;           /* убрали скругление → прямоугольные углы */
            background: #ffffff;
            transition: all 0.2s;
            outline: none;
            color: #0f172a;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        input.error-input {
            border-color: #e53e3e;
            background-color: #fff8f8;
        }

        .error-message {
            font-size: 0.75rem;
            color: #e53e3e;
            margin-top: 0.4rem;
            margin-left: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 1.8rem;
            background-color: #94a3b8;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s;
            margin-top: 0.8rem;
            letter-spacing: 0.3px;
        }

        button:active {
            transform: scale(0.97);
        }

        /* Цвет кнопки меняется при валидных данных */
        button.valid-data {
            background-color: #3b82f6;
        }

        button.valid-data:hover {
            background-color: #2563eb;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
            cursor: pointer;
        }

        button:not(.valid-data):hover {
            background-color: #94a3b8;
            cursor: default;
            transform: none;
        }

        hr {
            margin: 1.6rem 0 0.5rem;
            border: 0;
            height: 1px;
            background: #e2edf2;
        }

        .demo-hint {
            font-size: 0.7rem;
            text-align: center;
            color: #7f8c8d;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h1>Регистрация</h1>
    <div class="sub">создайте аккаунт за минуту</div>

    <div class="input-group">
        <label>Логин (только русские и английские буквы, 5–15 символов)</label>
        <!-- Убран placeholder "например: Ivan42" -->
        <input type="text" id="login" autocomplete="off">
        <div class="error-message" id="loginError"></div>
    </div>

    <div class="input-group">
        <label>Пароль (не менее 5 символов)</label>
        <!-- Убраны точки ••••••  -->
        <input type="password" id="password">
        <div class="error-message" id="passwordError"></div>
    </div>

    <button id="registerBtn">Зарегистрироваться</button>
    <div class="demo-hint">✔️ Кнопка меняет цвет при наведении → только если оба поля валидны</div>
</div>

<script>
    // DOM элементы
    const loginInput = document.getElementById('login');
    const passwordInput = document.getElementById('password');
    const loginErrorSpan = document.getElementById('loginError');
    const passwordErrorSpan = document.getElementById('passwordError');
    const registerBtn = document.getElementById('registerBtn');

    // Регулярное выражение для логина: только латиница / кириллица (включая Ёё), длина 5-15
    const loginRegex = /^[a-zA-Zа-яА-ЯёЁ]{5,15}$/;

    function validateLogin() {
        const loginValue = loginInput.value;
        let isValid = true;
        let errorText = '';

        if (!loginValue) {
            isValid = false;
            errorText = 'Логин не может быть пустым';
        } else if (!loginRegex.test(loginValue)) {
            isValid = false;
            errorText = '❌ Логин должен состоять только из русских или английских букв (без цифр и символов) и иметь длину 5–15 символов';
        }

        if (!isValid) {
            loginInput.classList.add('error-input');
            loginErrorSpan.textContent = errorText;
        } else {
            loginInput.classList.remove('error-input');
            loginErrorSpan.textContent = '';
        }
        return isValid;
    }

    function validatePassword() {
        const passwordValue = passwordInput.value;
        let isValid = true;
        let errorText = '';

        if (!passwordValue) {
            isValid = false;
            errorText = 'Пароль не может быть пустым';
        } else if (passwordValue.length < 5) {
            isValid = false;
            errorText = '❌ Пароль должен содержать не менее 5 символов (пробелы и любые знаки разрешены)';
        }

        if (!isValid) {
            passwordInput.classList.add('error-input');
            passwordErrorSpan.textContent = errorText;
        } else {
            passwordInput.classList.remove('error-input');
            passwordErrorSpan.textContent = '';
        }
        return isValid;
    }

    function updateButtonStyle() {
        const formValid = (validateLogin() && validatePassword());
        if (formValid) {
            registerBtn.classList.add('valid-data');
        } else {
            registerBtn.classList.remove('valid-data');
        }
        return formValid;
    }

    function handleInputValidation() {
        updateButtonStyle();
    }

    loginInput.addEventListener('input', handleInputValidation);
    loginInput.addEventListener('blur', () => {
        validateLogin();
        updateButtonStyle();
    });

    passwordInput.addEventListener('input', handleInputValidation);
    passwordInput.addEventListener('blur', () => {
        validatePassword();
        updateButtonStyle();
    });

    registerBtn.addEventListener('click', (e) => {
        e.preventDefault();
        
        const isLoginValid = validateLogin();
        const isPasswordValid = validatePassword();
        const allValid = isLoginValid && isPasswordValid;

        if (allValid) {
            alert(`✅ Успешная регистрация!\nЛогин: ${loginInput.value}\nПароль: ${'*'.repeat(passwordInput.value.length)}`);
        } else {
            if (!isLoginValid) {
                loginInput.focus();
            } else if (!isPasswordValid) {
                passwordInput.focus();
            }
        }
    });

    updateButtonStyle();
</script>
</body>
</html>
